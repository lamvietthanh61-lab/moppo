<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CPS Test PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>🖱 CPS Test</h1>

  <input id="playerName" placeholder="Nhập tên người chơi">

  <select id="timeSelect" onchange="toggleCustomTime()">
    <option value="1">1 giây</option>
    <option value="5">5 giây</option>
    <option value="10" selected>10 giây</option>
    <option value="15">15 giây</option>
    <option value="20">20 giây</option>
    <option value="custom">Tuỳ chỉnh</option>
  </select>

  <input
    id="customTime"
    type="number"
    min="1"
    placeholder="Nhập số giây (>=1)"
    style="display:none"
  >

  <button id="startBtn" onclick="startTest()">START</button>

  <div id="clickArea" onclick="registerClick()">
    CLICK HERE
  </div>

  <p>⏱ Thời gian: <span id="time">0</span>s</p>
  <p>🧮 Click: <span id="clicks">0</span></p>

  <h2>🏆 TOP 10</h2>
  <ol id="leaderboard"></ol>

  <h2>📊 CPS theo thời gian</h2>
  <canvas id="chart" width="300" height="150"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
