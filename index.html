<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CPS Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="mode-btn" onclick="toggleMode()">🌙</button>

<div class="container">
  <h1>CPS Test</h1>

  <input id="playerName" placeholder="Tên người chơi">

  <select id="timeSelect">
    <option value="1">1 giây</option>
    <option value="20">20 giây</option>
    <option value="custom">Tuỳ chỉnh</option>
  </select>
  <input id="customTime" type="number" placeholder="Giây" style="display:none">

  <button onclick="startTest()">Start</button>

  <div id="clickArea">CLICK</div>

  <p id="result"></p>
  <div id="profile"></div>
</div>

<audio id="clickSound" src="click.mp3"></audio>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
