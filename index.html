<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CPS Test PRO</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="mode-btn" onclick="toggleMode()">🌙 / ☀️</button>

<div class="container">
  <h1>🖱 CPS Test</h1>

  <input id="player" placeholder="Tên người chơi">

  <select id="timeSelect">
    <option value="5">5 giây</option>
    <option value="10" selected>10 giây</option>
    <option value="15">15 giây</option>
  </select>

  <div id="clickArea" onclick="registerClick()">CLICK</div>

  <p>⏱ Còn: <span id="time">0</span>s</p>
  <p>🧮 Click: <span id="clicks">0</span></p>
  <p>⚡ CPS: <span id="cps">0</span></p>
  <p>🏆 Kỷ lục: <span id="bestCps">0</span></p>

  <button onclick="resetTest()">Reset</button>

  <h2>🏅 Bảng xếp hạng</h2>
  <ol id="leaderboard"></ol>
</div>

<audio id="clickSound" src="click.mp3"></audio>

<script src="script.js"></script>
</body>
</html>
