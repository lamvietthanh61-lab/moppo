<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CPS Test</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<button class="mode-btn" onclick="toggleMode()">🌙</button>

<div class="container">
  <h1>⚡ CPS TEST</h1>

  <input id="playerName" placeholder="Tên người chơi">

  <select id="timeSelect">
    <option value="1">1 giây</option>
    <option value="20">20 giây</option>
    <option value="custom">Tùy chỉnh</option>
  </select>

  <input id="customTime" type="number" placeholder="Giây" style="display:none">

  <button id="startBtn" onclick="prepareGame()">▶ START</button>

  <div id="clickArea" style="display:none">CLICK</div>

  <p id="result"></p>

  <h2>👑 Profile</h2>
  <div id="profile"></div>

  <h2>🌍 Global Top 10</h2>
  <ul id="globalLeaderboard"></ul>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<script src="script.js"></script>
</body>
</html>
