<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>CPS Test</title>
  <link rel="stylesheet" href="style.css">

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
</head>
<body>

<div class="container">
  <h1>⚡ CPS TEST</h1>

  <input id="playerName" placeholder="Tên người chơi">

  <select id="timeSelect">
    <option value="1">1 giây</option>
    <option value="20">20 giây</option>
    <option value="custom">Tuỳ chỉnh</option>
  </select>

  <input id="customTime" type="number" min="1" placeholder="Nhập giây" style="display:none">

  <button id="startBtn">▶ START</button>

  <div id="clickArea" class="hidden">CLICK!</div>

  <p id="info"></p>
  <p id="rankInfo"></p>

  <h2>🏆 Leaderboard</h2>
  <ol id="leaderboard"></ol>
</div>

<script src="script.js"></script>
</body>
</html>
